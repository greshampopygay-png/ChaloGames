<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Цвет неба */
            font-family: Arial, sans-serif;
        }

        /* Верхняя панель с кнопками */
        #top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        /* Зеленые кнопки с белым текстом */
        .btn {
            padding: 10px 20px;
            background-color: #4CAF50; /* Зеленый цвет */
            color: #ffffff; /* Белый текст */
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            border: 2px solid #2E7D32; /* Темно-зеленая рамка */
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        /* Картинки Rudy */
        .rudy {
            position: absolute;
            width: 70px; /* Размер картинки */
            bottom: 0;
            left: 0;
            will-change: transform;
        }

        /* Стартовый экран */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        #start-btn {
            padding: 15px 30px;
            font-size: 24px;
            cursor: pointer;
            background-color: #4CAF50; /* Тоже зеленая кнопка */
            color: white;
            border: 2px solid #2E7D32;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
        }

        #start-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- Стартовый экран -->
    <div id="start-screen">
        <h1>Управление голосом: Эффект Попкорна!</h1>
        <p>Говори тихо — слегка подпрыгивают. Говори громко — разлетаются как попкорн во все стороны. Кричи — петух!</p>
        <button id="start-btn">Включить микрофон</button>
    </div>

    <!-- Верхние кнопки -->
    <div id="top-bar">
        <a href="mailto:8gravitygames@gmail.com" class="btn">Contact with developer</a>
        <a href="https://www.facebook.com/chaloapps.chaloapps" target="_blank" class="btn">Facebook</a>
    </div>

    <!-- Контейнер для картинок -->
    <div id="game-area"></div>

    <!-- Звук петуха -->
    <audio id="rooster-sound" src="https://assets.mixkit.co/active_storage/sfx/223/223-preview.mp3"></audio>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const gameArea = document.getElementById('game-area');
        const roosterSound = document.getElementById('rooster-sound');

        const NUM_IMAGES = 80; // Сделали МНОГО картинок
        const rudys = [];
        
        let audioContext, analyser, microphone, dataArray;
        let isRoosterPlaying = false;

        // Создаем картинки
        function spawnRudys() {
            for (let i = 0; i < NUM_IMAGES; i++) {
                let img = document.createElement('img');
                img.src = 'Rudy.png'; // ИМЯ ФАЙЛА ТВОЕЙ КАРТИНКИ
                img.className = 'rudy';
                
                // Начальная случайная позиция по горизонтали
                let startX = Math.random() * (window.innerWidth - 70);
                
                // Физические параметры для каждой картинки отдельно (эффект попкорна)
                let rudyData = {
                    element: img,
                    x: startX,
                    y: 0, // 0 - земля
                    vx: 0, // горизонтальная скорость (влево/вправо)
                    vy: 0, // вертикальная скорость (вверх/вниз)
                    rotation: Math.random() * 360, // текущий угол поворота
                    rotSpeed: 0 // скорость вращения
                };
                
                gameArea.appendChild(img);
                rudys.push(rudyData);
            }
        }

        // Инициализация микрофона
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                microphone.connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                startScreen.style.display = 'none'; // Убираем экран
                spawnRudys();
                update(); // Запускаем физику
                
            } catch (err) {
                alert('Не удалось получить доступ к микрофону! Разрешите доступ в настройках браузера.');
                console.error(err);
            }
        }

        startBtn.addEventListener('click', initAudio);

        // Главный цикл физики и анимации
        function update() {
            requestAnimationFrame(update);

            // Получаем громкость звука
            analyser.getByteFrequencyData(dataArray);
            let volume = 0;
            for (let i = 0; i < dataArray.length; i++) {
                volume += dataArray[i];
            }
            volume = volume / dataArray.length; // Средняя громкость от 0 до ~100+

            // Логика звука петуха (крик)
            if (volume > 85 && !isRoosterPlaying) {
                isRoosterPlaying = true;
                roosterSound.play();
                roosterSound.onended = () => {
                    isRoosterPlaying = false;
                };
            }

            // Физика для каждой картинки отдельно
            rudys.forEach(r => {
                
                // ---- ЭФФЕКТ ПОПКОРНА ОТ ЗВУКА ----
                
                if (volume > 15 && volume <= 40) {
                    // Тихо говорим: легкое хаотичное подпрыгивание (срабатывает не у всех сразу, чтобы было вразнобой)
                    if (Math.random() > 0.8) {
                        r.vy += Math.random() * 4; // Прыжок вверх
                        r.vx += (Math.random() - 0.5) * 6; // Сдвиг влево-вправо
                        r.rotSpeed = (Math.random() - 0.5) * 10; // Легкое вращение
                    }
                } 
                else if (volume > 40) {
                    // Громко говорим: сильный взрыв попкорна
                    if (Math.random() > 0.4) {
                        r.vy += Math.random() * (volume * 0.15); // Чем громче, тем сильнее случайный прыжок
                        r.vx += (Math.random() - 0.5) * (volume * 0.4); // Сильный разлет по сторонам
                        r.rotSpeed = (Math.random() - 0.5) * 30; // Сильное вращение
                    }
                }

                // ---- ГРАВИТАЦИЯ И ДВИЖЕНИЕ ----
                
                r.vy -= 1.2; // Гравитация тянет вниз
                r.x += r.vx; // Применяем скорость по X
                r.y += r.vy; // Применяем скорость по Y
                r.rotation += r.rotSpeed; // Крутим картинку

                // Трение о воздух (чтобы по горизонтали они постепенно останавливались)
                r.vx *= 0.98;
                r.rotSpeed *= 0.98;

                // ---- СТОЛКНОВЕНИЯ ----

                // Столкновение с полом (отскок)
                if (r.y <= 0) {
                    r.y = 0;
                    r.vy = r.vy * -0.3; // Пружинят от пола
                    r.vx *= 0.8; // Трение об пол (быстрее останавливаются по горизонтали)
                    
                    // Если скорость отскока совсем маленькая — останавливаем, чтобы не дрожали
                    if (Math.abs(r.vy) < 2) {
                        r.vy = 0;
                    }
                }

                // Столкновение со стенами (отскок от левого и правого края)
                if (r.x <= 0) {
                    r.x = 0;
                    r.vx = r.vx * -0.7; // Отскок от левой стены
                }
                if (r.x >= window.innerWidth - 70) {
                    r.x = window.innerWidth - 70;
                    r.vx = r.vx * -0.7; // Отскок от правой стены
                }

                // Столкновение с потолком (чтобы не улетали в космос)
                if (r.y >= window.innerHeight - 100) {
                    r.y = window.innerHeight - 100;
                    r.vy = r.vy * -0.5; // Отбиваются от потолка
                }

                // ---- ОТРИСОВКА ----
                // Применяем все вычисленные координаты и углы к картинке на экране
                r.element.style.transform = `translate(${r.x}px, -${r.y}px) rotate(${r.rotation}deg)`;
            });
        }
    </script>
</body>
</html>
