<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Цвет неба */
            font-family: Arial, sans-serif;
        }

        /* Верхняя панель с кнопками */
        #top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        /* Зеленые кнопки с белым текстом */
        .btn {
            padding: 10px 20px;
            background-color: #4CAF50; /* Зеленый цвет */
            color: #ffffff; /* Белый текст */
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            border: 2px solid #2E7D32; /* Темно-зеленая рамка */
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        /* Картинки Rudy */
        .rudy {
            position: absolute;
            width: 70px; /* Размер картинки */
            bottom: 0;
            left: 0;
            will-change: transform;
        }

        /* Стартовый экран */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        #start-btn {
            padding: 15px 30px;
            font-size: 24px;
            cursor: pointer;
            background-color: #4CAF50; /* Зеленая кнопка */
            color: #ffffff; /* Белый текст */
            border: 2px solid #2E7D32;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
        }

        #start-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- Стартовый экран -->
    <div id="start-screen">
        <h1>Управление голосом: Эффект Попкорна!</h1>
        <p>Говори тихо — слегка подпрыгивают. Говори громче — разлетаются как попкорн. Кричи — петух!</p>
        <button id="start-btn">Включить микрофон</button>
    </div>

    <!-- Верхние зеленые кнопки -->
    <div id="top-bar">
        <a href="mailto:8gravitygames@gmail.com" class="btn">Contact with developer</a>
        <a href="https://www.facebook.com/chaloapps.chaloapps" target="_blank" class="btn">Facebook</a>
    </div>

    <!-- Контейнер для картинок -->
    <div id="game-area"></div>

    <!-- ТВОЙ ЛОКАЛЬНЫЙ ЗВУК ПЕТУХА -->
    <audio id="rooster-sound" src="rooster_crowing.mp3"></audio>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const gameArea = document.getElementById('game-area');
        const roosterSound = document.getElementById('rooster-sound');

        const NUM_IMAGES = 80; // Много картинок на экране
        const rudys = [];
        
        let audioContext, analyser, microphone, dataArray;
        let isRoosterPlaying = false;

        // Создаем картинки
        function spawnRudys() {
            for (let i = 0; i < NUM_IMAGES; i++) {
                let img = document.createElement('img');
                img.src = 'Rudy.png'; // Ваша картинка
                img.className = 'rudy';
                
                // Случайная начальная позиция по ширине
                let startX = Math.random() * (window.innerWidth - 70);
                
                // Физические параметры для эффекта попкорна
                let rudyData = {
                    element: img,
                    x: startX,
                    y: 0,
                    vx: 0, 
                    vy: 0, 
                    rotation: Math.random() * 360,
                    rotSpeed: 0
                };
                
                gameArea.appendChild(img);
                rudys.push(rudyData);
            }
        }

        // Включение микрофона
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                microphone.connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                startScreen.style.display = 'none';
                spawnRudys();
                update();
                
            } catch (err) {
                alert('Не удалось получить доступ к микрофону! Разрешите доступ в настройках браузера.');
                console.error(err);
            }
        }

        startBtn.addEventListener('click', initAudio);

        // Главный цикл физики и анимации
        function update() {
            requestAnimationFrame(update);

            // Получаем уровень громкости
            analyser.getByteFrequencyData(dataArray);
            let volume = 0;
            for (let i = 0; i < dataArray.length; i++) {
                volume += dataArray[i];
            }
            volume = volume / dataArray.length;

            // Воспроизведение твоего звука rooster_crowing.mp3 при громком крике
            if (volume > 85 && !isRoosterPlaying) {
                isRoosterPlaying = true;
                roosterSound.play();
                roosterSound.onended = () => {
                    isRoosterPlaying = false;
                };
            }

            // Физика попкорна для каждой картинки
            rudys.forEach(r => {
                
                // Импульсы от громкости
                if (volume > 15 && volume <= 40) {
                    if (Math.random() > 0.8) {
                        r.vy += Math.random() * 4;
                        r.vx += (Math.random() - 0.5) * 6;
                        r.rotSpeed = (Math.random() - 0.5) * 10;
                    }
                } 
                else if (volume > 40) {
                    if (Math.random() > 0.4) {
                        r.vy += Math.random() * (volume * 0.15);
                        r.vx += (Math.random() - 0.5) * (volume * 0.4);
                        r.rotSpeed = (Math.random() - 0.5) * 30;
                    }
                }

                // Гравитация и перемещение
                r.vy -= 1.2;
                r.x += r.vx;
                r.y += r.vy;
                r.rotation += r.rotSpeed;

                // Сопротивление воздуха
                r.vx *= 0.98;
                r.rotSpeed *= 0.98;

                // Отскок от пола
                if (r.y <= 0) {
                    r.y = 0;
                    r.vy = r.vy * -0.3;
                    r.vx *= 0.8;
                    
                    if (Math.abs(r.vy) < 2) {
                        r.vy = 0;
                    }
                }

                // Отскок от левой и правой стен
                if (r.x <= 0) {
                    r.x = 0;
                    r.vx = r.vx * -0.7;
                }
                if (r.x >= window.innerWidth - 70) {
                    r.x = window.innerWidth - 70;
                    r.vx = r.vx * -0.7;
                }

                // Отскок от верха
                if (r.y >= window.innerHeight - 100) {
                    r.y = window.innerHeight - 100;
                    r.vy = r.vy * -0.5;
                }

                // Обновление стиля
                r.element.style.transform = `translate(${r.x}px, -${r.y}px) rotate(${r.rotation}deg)`;
            });
        }
    </script>
</body>
</html>
